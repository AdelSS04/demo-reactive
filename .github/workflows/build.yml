name: Build and Test Angular App

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Lint code (if available)
      run: npm run lint --if-present
      continue-on-error: true
      
    - name: Run tests (if available)
      run: npm run test -- --watch=false --browsers=ChromeHeadless --if-present
      continue-on-error: true
      
    - name: Build application (development)
      run: npm run build
      
    - name: Build application (production)
      run: npm run build -- --configuration=production
      
    - name: Verify build artifacts
      run: |
        if [ -d "dist" ]; then
          echo "✅ Build successful! Distribution files created."
          echo "📁 Build output:"
          ls -la dist/
          echo ""
          echo "📦 Main bundle files:"
          find dist/ -name "*.js" -o -name "*.css" | head -10
        else
          echo "❌ Build failed! No distribution files found."
          exit 1
        fi
        
    - name: Check bundle size
      run: |
        if [ -d "dist" ]; then
          echo "📦 Bundle Analysis:"
          find dist/ -name "*.js" -type f -exec du -h {} + | sort -hr
        fi

  build-status:
    runs-on: ubuntu-latest
    needs: build
    if: always()
    
    steps:
    - name: Build Success Notification
      if: needs.build.result == 'success'
      run: |
        echo "🎉 Angular Reactive Forms Showcase - Build Status: SUCCESS"
        echo "✅ All builds completed successfully across Node.js versions"
        echo "🚀 Application is ready for deployment"
        
    - name: Build Failure Notification  
      if: needs.build.result == 'failure'
      run: |
        echo "❌ Angular Reactive Forms Showcase - Build Status: FAILED"
        echo "🔧 Please check the build logs for errors"
        exit 1